name: enrich chemical identities

on:
  push:
    branches: [feature/chemical-identities-multilingual]
    paths:
      - scripts/enrich_chemical_aliases.py
      - .github/workflows/enrich-chemical-identities.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/chemical-identities-multilingual
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/enrich_chemical_aliases.py
      - name: Commit generated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chemical_substances.csv data/chemical_aliases.csv
          if git diff --cached --quiet; then
            echo "Registry already up to date."
          else
            git commit -m "data: refresh chemical identity registry"
            git push
          fi
